<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" role="img" aria-label="Pipeline from Common Crawl shards to a published embedding">
  <title>Pipeline from Common Crawl shards to a published embedding</title>
  <desc>Seven stages: download 13.4 B edges over 24 vertex and 144 edge shards, cut to hosts of degree 8 or more (52,913,544 nodes, 13,071,431,429 edges), memory-map, split, train on 4 GPUs, export and publish. The degree cut drops 81.1% of nodes but only 2.7% of edges. Total cost about 4.3 GPU-hours.</desc>
  <rect x="0" y="0" width="1180" height="530" fill="#ffffff" />
  <text x="40" y="40" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#152a47" font-weight="600">Pipeline: Common Crawl shards to published embeddings</text>
  <text x="40" y="64" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#44536f">cc-main-2025-26-nov-dec-jan  ·  13.4 B edges  -&gt;  52,913,544 host vectors</text>
  <text x="82" y="94" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6e7191" font-weight="600">STAGE</text>
  <text x="468" y="94" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6e7191" font-weight="600">SCALE</text>
  <text x="640" y="94" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6e7191" font-weight="600">COST</text>
  <line x1="55" y1="122" x2="55" y2="442" stroke="#dde2e8" stroke-width="1" />
  <circle cx="55" cy="122" r="8.5" fill="#ffffff" stroke="#dde2e8" stroke-width="1.5" />
  <text x="55" y="125.5" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#44536f" text-anchor="middle" font-weight="600">1</text>
  <text x="82" y="120" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#152a47">Download</text>
  <text x="82" y="137" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6e7191">scripts/download_cc_hostgraph.sh</text>
  <text x="468" y="126" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">279.4 M hosts / 13.43 B edges</text>
  <text x="640" y="126" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">24 + 144 shards, 56 GB</text>
  <line x1="82" y1="148" x2="750" y2="148" stroke="#e8ecf2" stroke-width="1" />
  <circle cx="55" cy="174" r="8.5" fill="#ffffff" stroke="#dde2e8" stroke-width="1.5" />
  <text x="55" y="177.5" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#44536f" text-anchor="middle" font-weight="600">2</text>
  <text x="82" y="172" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#152a47">Slice deg ≥ 8</text>
  <text x="82" y="189" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6e7191">wgl data min-degree-slice --streaming</text>
  <text x="468" y="178" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">52.9 M / 13.07 B</text>
  <text x="640" y="178" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">1 h 13 m CPU</text>
  <line x1="82" y1="200" x2="750" y2="200" stroke="#e8ecf2" stroke-width="1" />
  <circle cx="55" cy="226" r="8.5" fill="#ffffff" stroke="#dde2e8" stroke-width="1.5" />
  <text x="55" y="229.5" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#44536f" text-anchor="middle" font-weight="600">3</text>
  <text x="82" y="224" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#152a47">Memmap edges</text>
  <text x="82" y="241" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6e7191">wgl data extract-edge-index</text>
  <text x="468" y="230" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">~105 GB int32 COO</text>
  <text x="640" y="230" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">~7 min</text>
  <line x1="82" y1="252" x2="750" y2="252" stroke="#e8ecf2" stroke-width="1" />
  <circle cx="55" cy="278" r="8.5" fill="#ffffff" stroke="#dde2e8" stroke-width="1.5" />
  <text x="55" y="281.5" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#44536f" text-anchor="middle" font-weight="600">4</text>
  <text x="82" y="276" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#152a47">Split cache</text>
  <text x="82" y="293" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6e7191">wgl data stream-split-cache</text>
  <text x="468" y="282" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">train 10.457 B (80%)</text>
  <text x="640" y="282" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">~45 min CPU</text>
  <line x1="82" y1="304" x2="750" y2="304" stroke="#e8ecf2" stroke-width="1" />
  <circle cx="55" cy="330" r="8.5" fill="#0050bd" stroke="#0050bd" stroke-width="1.5" />
  <text x="55" y="333.5" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="600">5</text>
  <text x="82" y="328" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#152a47" font-weight="600">Train LP</text>
  <text x="82" y="345" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6e7191">scripts/cupyg_lp.py (4 x H100)</text>
  <text x="468" y="334" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">eff. batch 131,072</text>
  <text x="640" y="334" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">1 h 04 m</text>
  <line x1="82" y1="356" x2="750" y2="356" stroke="#e8ecf2" stroke-width="1" />
  <circle cx="55" cy="382" r="8.5" fill="#ffffff" stroke="#dde2e8" stroke-width="1.5" />
  <text x="55" y="385.5" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#44536f" text-anchor="middle" font-weight="600">6</text>
  <text x="82" y="380" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#152a47">Export</text>
  <text x="82" y="397" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6e7191">--export-emb</text>
  <text x="468" y="386" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">[52.9 M, 128] fp32, 27.09 GB</text>
  <text x="640" y="386" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">in-job</text>
  <line x1="82" y1="408" x2="750" y2="408" stroke="#e8ecf2" stroke-width="1" />
  <circle cx="55" cy="434" r="8.5" fill="#ffffff" stroke="#dde2e8" stroke-width="1.5" />
  <text x="55" y="437.5" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#44536f" text-anchor="middle" font-weight="600">7</text>
  <text x="82" y="432" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#152a47">Publish</text>
  <text x="82" y="449" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6e7191">wgl release shard-export</text>
  <text x="468" y="438" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">fp16 Parquet, 4 M rows/shard</text>
  <text x="640" y="438" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">14 shards</text>
  <text x="800" y="94" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6e7191" font-weight="600">WHAT THE DEGREE CUT COSTS</text>
  <rect x="800" y="104" width="340" height="218" fill="#f6f7fa" rx="8" stroke="#dde2e8" stroke-width="1" />
  <text x="818" y="130" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#152a47" font-weight="600">keep hosts with total degree ≥ 8</text>
  <text x="818" y="158" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f" font-weight="600">hosts</text>
  <text x="1122" y="158" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#6e7191" text-anchor="end">279,356,058  -&gt;  52,913,544</text>
  <rect x="818" y="168" width="55.58" height="22" fill="#0050bd" rx="2" />
  <rect x="875.58" y="168" width="246.42" height="22" fill="#e3e8ef" rx="2" />
  <text x="818" y="206" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#0050bd" font-weight="600">kept 18.9%</text>
  <text x="1122" y="206" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#6e7191" text-anchor="end">dropped 81.1% -&gt; fallback ladder</text>
  <text x="818" y="234" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f" font-weight="600">edges</text>
  <text x="1122" y="234" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#6e7191" text-anchor="end">13.4 B  -&gt;  13.1 B</text>
  <rect x="818" y="244" width="293.79" height="22" fill="#0050bd" rx="2" />
  <rect x="1113.79" y="244" width="8.21" height="22" fill="#e3e8ef" rx="2" />
  <text x="818" y="282" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#0050bd" font-weight="600">kept 97.3%</text>
  <text x="1122" y="282" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#6e7191" text-anchor="end">dropped 2.7% -&gt; fallback ladder</text>
  <text x="818" y="310" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#152a47">Drops four fifths of the hosts, 2.7% of the structure.</text>
  <text x="800" y="342" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#6e7191" font-weight="600">COMPUTE</text>
  <rect x="800" y="352" width="340" height="92" fill="#f6f7fa" rx="8" stroke="#dde2e8" stroke-width="1" />
  <text x="818" y="382" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#44536f" font-weight="600">GPU  train + export</text>
  <text x="1122" y="382" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0050bd" text-anchor="end" font-weight="600">4.3 h</text>
  <text x="818" y="397" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#6e7191">4 x H100 85 GB  ·  9.70 M edges/s</text>
  <text x="818" y="422" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#44536f" font-weight="600">CPU  prepare</text>
  <text x="1122" y="422" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#ff9220" text-anchor="end" font-weight="600">~2 h</text>
  <text x="818" y="437" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#6e7191">single-threaded</text>
  <text x="40" y="500" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">The published table is 27.09 GB of fp32 (52,913,544 x 128); the served tier is fp16.</text>
</svg>
