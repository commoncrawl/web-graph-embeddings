<svg xmlns="http://www.w3.org/2000/svg" width="810" height="846" viewBox="0 0 810 846" role="img" aria-label="Architecture of the shipped web-graph embedding model">
  <title>Architecture of the shipped web-graph embedding model</title>
  <desc>A featureless embedding table of 52,913,544 rows by 128 dimensions (6.77 B parameters, 27.09 GB), sharded across 4 GPUs with WholeMemory. Each step looks up a source and destination row for a batch of 32,768 edges per rank, scores them with a dot product against 50 in-batch negatives, and optimises BCEWithLogits with WholeMemory sparse Adam. There is no message passing and no node features; the graph is not GPU-resident. Validated GraphSAGE and ComplEx variants are shown as alternatives that did not ship.</desc>
  <rect x="0" y="0" width="810" height="846" fill="#ffffff" />
  <text x="40" y="40" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#152a47" font-weight="600">A shallow graph embedding: one vector per host</text>
  <text x="40" y="64" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#44536f">cc_deg8_shallow_full  ·  a learnable lookup table trained by link prediction  ·  LINE-1st / PBG-dot family</text>
  <text x="40" y="88" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#6e7191" font-weight="600">1 · INPUT</text>
  <rect x="40" y="96" width="730" height="62" fill="#f6f7fa" rx="8" stroke="#dde2e8" stroke-width="1" />
  <text x="58" y="122" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#152a47" font-weight="600">host id  i</text>
  <text x="58" y="142" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">row index into node_names.txt — 52,913,544 CC-reversed hostnames</text>
  <rect x="492" y="110" width="262" height="34" fill="#ffffff" rx="6" stroke="#ff9220" stroke-width="1.5" />
  <text x="623" y="126" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#ff9220" text-anchor="middle" font-weight="600">FEATURELESS — the id is the input</text>
  <text x="623" y="139" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#6e7191" text-anchor="middle">no node features, no hostnames, no metadata</text>
  <line x1="405" y1="158" x2="405" y2="173" stroke="#dde2e8" stroke-width="1.5" />
  <polygon points="405,180 402.06,173 407.94,173" fill="#dde2e8" />
  <text x="40" y="192" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#6e7191" font-weight="600">2 · PARAMETERS — THE WHOLE MODEL</text>
  <rect x="40" y="200" width="730" height="168" fill="#f6f7fa" rx="8" stroke="#dde2e8" stroke-width="1" />
  <rect x="58" y="216" width="694" height="52" fill="#0050bd" rx="6" />
  <text x="74" y="239" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#ffffff" font-weight="600">nn.Embedding(52,913,544, 128)</text>
  <text x="736" y="239" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" fill="#ffffff" text-anchor="end">6.77 B params · fp32 · 27.09 GB</text>
  <text x="58" y="288" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#44536f">sharded across 4 x H100 85 GB by WholeMemory - gathered over NVLink</text>
  <rect x="58" y="298" width="169" height="54" fill="#ffffff" rx="6" stroke="#dde2e8" stroke-width="1" />
  <text x="142.5" y="316" font-family="'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#44536f" text-anchor="middle" font-weight="600">rank 0</text>
